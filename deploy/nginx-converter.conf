# Converter: served at https://shanmugam.is-a.dev/converter/ alongside the portfolio.
#
# Install:
#   sudo cp deploy/nginx-converter-ratelimit.conf /etc/nginx/conf.d/converter-ratelimit.conf
#   sudo cp deploy/nginx-converter.conf /etc/nginx/snippets/converter.conf
#   then add this line inside the portfolio's `listen 443 ssl` server block:
#       include snippets/converter.conf;
#   sudo nginx -t && sudo systemctl reload nginx

location = /converter {
    return 301 /converter/;
}

location /converter/api/ {
    # Uploads are limited per visitor so one person can't hog the server.
    limit_req zone=converter_api burst=10 nodelay;
    limit_req_status 429;

    client_max_body_size 110m;

    proxy_pass http://127.0.0.1:8001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 660s;   # long videos
    proxy_send_timeout 660s;
}

location /converter/ {
    proxy_pass http://127.0.0.1:8001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
