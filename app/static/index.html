<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Converter: convert, compress, resize and more</title>
  <meta name="description" content="Free file tools. Convert PNG to JPG, PDF to images, compress photos and PDFs, merge and split PDFs, video to MP3, text from images and QR codes. Files are never stored." />
  <link rel="icon" href="static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="static/styles.css" />
</head>
<body>
  <header class="top wrap">
    <a class="brand" href="#convert" aria-label="Converter home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="6" width="15" height="20" rx="3" class="b1"/><rect x="14" y="6" width="15" height="20" rx="3" class="b2"/><path d="M12 16h9m-3-3 3 3-3 3" class="b3"/></svg>
      Converter
    </a>
    <p class="promise">Files are processed and then deleted. Nothing is kept.</p>
  </header>

  <div class="wrap intro">
    <h1>Fix any file in a few clicks.</h1>
    <p class="lead">Convert, shrink, resize, combine and more. Free, with no sign&#8209;up.</p>
  </div>

  <div class="wrap layout">
    <nav class="menu" id="menu" aria-label="Tools"></nav>

    <main class="panel" id="panel">
      <h2 id="toolTitle" tabindex="-1"></h2>
      <p class="blurb" id="toolBlurb"></p>

      <section class="tray" id="tray" aria-label="Add files">
        <input type="file" id="picker" hidden />
        <div class="tray-empty" id="trayEmpty">
          <svg class="tray-art" viewBox="0 0 120 80" aria-hidden="true">
            <rect x="10" y="14" width="44" height="56" rx="6" class="f1"/>
            <rect x="66" y="10" width="44" height="56" rx="6" class="f2"/>
            <path d="M44 42h32m-8-8 8 8-8 8" class="arr"/>
          </svg>
          <p class="tray-title" id="trayTitle">Drop files here</p>
          <p class="tray-sub">or <button type="button" class="link" id="choose">choose from your device</button></p>
          <p class="tray-hint" id="trayHint"></p>
        </div>
        <ul class="files" id="files" hidden></ul>
        <div class="tray-actions" id="trayActions" hidden>
          <button type="button" class="ghost" id="addMore">Add more files</button>
          <button type="button" class="ghost" id="clearAll">Remove all</button>
        </div>
      </section>

      <form class="opts" id="opts" onsubmit="return false"></form>

      <div class="go">
        <button type="button" class="convert" id="run" disabled></button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>

      <section class="result" id="result" hidden aria-live="polite"></section>
    </main>
  </div>

  <footer class="wrap foot">
    <p>Made by <a href="https://shanmugam.is-a.dev">Shanmugam</a>. Your files go straight to the tool and are deleted as soon as you download the result.</p>
  </footer>

  <script src="static/tools.js"></script>
  <script src="static/app.js"></script>
</body>
</html>
